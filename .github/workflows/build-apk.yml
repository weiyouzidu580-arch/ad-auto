name: Build AdAuto Release APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "app/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - "gradle/**"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android 34 components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Prepare ephemeral release signing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p keystore
          PASS="$(openssl rand -hex 24)"
          keytool -genkeypair -v -keystore keystore/adauto.keystore -storepass "$PASS" -alias adauto -keypass "$PASS" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=AdAuto Personal Build, OU=Local, O=Personal, C=SG"
          {
            echo "storeFile=keystore/adauto.keystore"
            echo "storePassword=$PASS"
            echo "keyAlias=adauto"
            echo "keyPassword=$PASS"
          } > keystore.properties

      - name: Build release APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AdAuto-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
